# Sidecar profile: two warmup steps, then continuously capture from step 3 onward.
# Native memory tracing is disabled for low-overhead long runs.
seed: 0
output_dir: ./output
load_checkpoint: ''
src_strategy_path_or_dir: ''
auto_trans_ckpt: false
only_save_strategy: false
resume_training: false
run_mode: train
trainer:
  type: CausalLanguageModelingTrainer
  model_name: llama2_7b
runner_config:
  epochs: 2
  batch_size: 1
  sink_mode: true
  sink_size: 2
  gradient_accumulation_steps: 8
optimizer:
  type: FP32StateAdamWeightDecay
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-08
  learning_rate: 5.0e-05
lr_schedule:
  type: CosineWithWarmUpLR
  learning_rate: 5.0e-05
  lr_end: 0
  warmup_ratio: 0.03
  total_steps: -1
train_dataset: &id001
  data_loader:
    type: MindDataset
    dataset_dir: /root/work/cyf/dataset/llama2_4096_20steps/train.mindrecord
    shuffle: true
  input_columns:
  - input_ids
  num_parallel_workers: 8
  python_multiprocessing: false
  drop_remainder: true
  batch_size: 6
  repeat: 1
  numa_enable: false
  prefetch_size: 1
train_dataset_task:
  type: CausalLanguageModelDataset
  dataset_config: *id001
do_eval: false
eval_dataset: &id002
  data_loader:
    type: MindDataset
    dataset_dir: ''
    shuffle: false
  input_columns:
  - input_ids
  num_parallel_workers: 8
  python_multiprocessing: false
  drop_remainder: false
  repeat: 1
  numa_enable: false
  prefetch_size: 1
eval_dataset_task:
  type: CausalLanguageModelDataset
  dataset_config: *id002
use_parallel: true
parallel:
  parallel_mode: 1
  gradients_mean: false
  enable_alltoall: false
  full_batch: true
  search_mode: sharding_propagation
  enable_parallel_optimizer: true
  strategy_ckpt_save_file: ./ckpt_strategy.ckpt
  parallel_optimizer_config:
    gradient_accumulation_shard: false
    parallel_optimizer_threshold: 64
parallel_config:
  data_parallel: 8
  model_parallel: 1
  pipeline_stage: 1
  use_seq_parallel: false
  micro_batch_num: 1
  vocab_emb_dp: true
  gradient_aggregation_group: 4
micro_batch_interleave_num: 1
recompute_config:
  recompute: false
  select_recompute: false
  parallel_optimizer_comm_recompute: false
  mp_comm_recompute: true
  recompute_slice_activation: true
callbacks:
- type: MFLossMonitor
- type: TrainCallBack
  stop_step: 20
- type: CheckpointMonitor
  prefix: llama2_7b
  save_checkpoint_steps: 100
  integrated_save: false
  async_save: false
- type: ObsMonitor
context:
  mode: 0
  device_target: Ascend
  enable_graph_kernel: false
  max_call_depth: 10000
  max_device_memory: 58GB
  save_graphs: false
  save_graphs_path: ./graph
  device_id: 0
  enable_compile_cache: true
model:
  model_config:
    type: LlamaConfig
    batch_size: 1
    seq_length: 4096
    hidden_size: 4096
    num_layers: 32
    num_heads: 32
    vocab_size: 32000
    multiple_of: 256
    rms_norm_eps: 1.0e-05
    bos_token_id: 1
    eos_token_id: 2
    pad_token_id: 0
    ignore_token_id: -100
    compute_dtype: float16
    layernorm_compute_type: float32
    softmax_compute_type: float16
    rotary_dtype: float16
    param_init_type: float16
    use_past: false
    scaling_factor: 1.0
    extend_method: None
    use_flash_attention: true
    offset: 0
    checkpoint_name_or_path: llama2_7b
    repetition_penalty: 1
    max_decode_length: 512
    top_k: 3
    top_p: 1
    do_sample: false
  arch:
    type: LlamaForCausalLM
processor:
  return_tensors: ms
  tokenizer:
    vocab_file: /root/work/cyf/mindformers_r1.3.2/tests/utils/llama2_tokenizer/tokenizer.model
    unk_token: <unk>
    bos_token: <s>
    eos_token: </s>
    pad_token: <unk>
    type: LlamaTokenizer
  type: LlamaProcessor
metric:
  type: PerplexityMetric
runner_wrapper:
  type: MFTrainOneStepCell
  scale_sense:
    type: DynamicLossScaleUpdateCell
    loss_scale_value: 65536
    scale_factor: 2
    scale_window: 1000
  use_clip_grad: true
eval_callbacks:
- type: ObsMonitor
auto_tune: false
filepath_prefix: ./autotune
autotune_per_step: 10
profile: true
profile_output: /root/work/cyf/pretrain/traces/llama7b
profile_start_step: 4
profile_stop_step: 20
init_start_profile: false
profile_communication: true
profile_memory: false
layer_scale: false
layer_decay: 0.65
lr_scale_factor: 256
remote_save_url: Please input obs url on AICC platform.
profiler_level: 0
